# Independent GLOBAL services; only the authenticated gateway is published,
# and only on host loopback. No existing MetaMCP container is modified.
x-kit-labels: &kit-labels
  com.multfinite.mcpkit.instance: ${MCPKIT_INSTANCE}
services:
  gateway:
    image: ${MCPKIT_IMAGE}
    build:
      context: ${MCPKIT_BUILD_DIR}
      labels: *kit-labels
    pull_policy: never
    environment:
      MCPKIT_GATEWAY_KEY: ${MCPKIT_GATEWAY_KEY}
      MCPKIT_CONTROL_KEY: ${MCPKIT_CONTROL_KEY}
      MCPKIT_INSTANCE_ID: ${MCPKIT_INSTANCE}
      # Каждая переменная называет сервер, которому она нужна: MCPKIT_<SERVER>_<WHAT>.
      # Общих имён нет: иначе Graphiti и Cognee нельзя настроить по-разному.
      MCPKIT_NEO4J_PASSWORD: ${MCPKIT_NEO4J_PASSWORD:-}
      MCPKIT_CONTEXT7_API_KEY: ${MCPKIT_CONTEXT7_API_KEY:-}
      MCPKIT_GRAPHITI_API_KEY: ${MCPKIT_GRAPHITI_API_KEY:-}
      MCPKIT_COGNEE_LLM_API_KEY: ${MCPKIT_COGNEE_LLM_API_KEY:-}
    ports:
      - "127.0.0.1:${MCPKIT_PORT}:13001"
    volumes:
      - gateway_data:/data
    # The gateway reaches the sidecars on default, but MetaMCP is only
    # connected to the separate client network. Never attach sidecars to it.
    networks:
      default: {}
      client:
        aliases:
          - "${MCPKIT_PROJECT}-gateway"
    labels: *kit-labels
    restart: unless-stopped
  neo4j:
    image: neo4j:community
    environment:
      NEO4J_AUTH: neo4j/${MCPKIT_NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    labels: *kit-labels
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    labels: *kit-labels
    restart: unless-stopped
  # OpenAI-совместимая точка для Graphiti и Cognee: добавляет обязательный для
  # OpenCode Go заголовок x-opencode-session и разводит chat и embeddings.
  # Собирается из официального nginx (20 МБ), без собственного образа.
  llm-proxy:
    image: nginx:alpine
    environment:
      NGINX_ENVSUBST_FILTER: "^MCPKIT_"
      MCPKIT_LLM_PROXY_API_KEY: ${MCPKIT_LLM_PROXY_API_KEY:-}
      MCPKIT_LLM_PROXY_SESSION: ${MCPKIT_LLM_PROXY_SESSION:-MCP-KIT-WORK}
    volumes:
      # Путь передаёт кит: относительный резолвился бы от --project-directory
      # (каталог установки), а не от каталога репозитория.
      - ${MCPKIT_LLM_PROXY_CONF:-/mcp-kit/common/llm-proxy/nginx.conf.template}:/etc/nginx/templates/default.conf.template:ro
    labels: *kit-labels
    restart: unless-stopped
  # Локальные эмбеддинги: у OpenCode Go их нет вообще (404 на /embeddings), а
  # Graphiti и Cognee без них не строят граф. Модель скачивается при первом
  # старте контейнера (MCPKIT_EMBEDDINGS_MODEL, по умолчанию nomic-embed-text).
  embeddings:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -gt 60 ]; then echo 'Ollama не поднялся за 120 с' >&2; break; fi
          sleep 2
        done
        ollama pull "$$MCPKIT_EMBEDDINGS_MODEL" || echo "Не удалось скачать $$MCPKIT_EMBEDDINGS_MODEL" >&2
        wait $$pid
    environment:
      MCPKIT_EMBEDDINGS_MODEL: ${MCPKIT_EMBEDDINGS_MODEL:-nomic-embed-text}
    volumes:
      - embeddings_data:/root/.ollama
    labels: *kit-labels
    restart: unless-stopped
  graphiti:
    image: zepai/knowledge-graph-mcp:standalone
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$OPENAI_API_KEY" ]; then
          echo 'Graphiti needs MCPKIT_GRAPHITI_API_KEY in the private kit env.' >&2
          exec sleep infinity
        fi
        exec uv run --no-sync main.py --transport http --host 0.0.0.0 --database-provider neo4j
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${MCPKIT_NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${MCPKIT_GRAPHITI_NEO4J_DATABASE:-neo4j}
      OPENAI_API_KEY: ${MCPKIT_GRAPHITI_API_KEY:-}
      OPENAI_BASE_URL: ${MCPKIT_GRAPHITI_API_ENDPOINT:-https://api.openai.com/v1}
      MODEL_NAME: ${MCPKIT_GRAPHITI_API_MODEL:-gpt-4o-mini}
      EMBEDDER_MODEL: ${MCPKIT_GRAPHITI_EMBEDDER_MODEL:-text-embedding-3-small}
      GRAPHITI_GROUP_ID: ${MCPKIT_GRAPHITI_GROUP_ID:-multfinite-mcp-kit-global}
    labels: *kit-labels
    restart: unless-stopped
  cognee:
    image: cognee/cognee-mcp:main
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$LLM_API_KEY" ]; then
          echo 'Cognee needs MCPKIT_COGNEE_LLM_API_KEY in the private kit env.' >&2
          exec sleep infinity
        fi
        exec /app/entrypoint.sh
    environment:
      TRANSPORT_MODE: http
      MCP_ALLOWED_HOSTS: "cognee:*"
      LLM_PROVIDER: ${MCPKIT_COGNEE_LLM_API_PROVIDER:-openai}
      LLM_API_KEY: ${MCPKIT_COGNEE_LLM_API_KEY:-}
      LLM_MODEL: ${MCPKIT_COGNEE_LLM_API_MODEL:-gpt-4o-mini}
      LLM_ENDPOINT: ${MCPKIT_COGNEE_LLM_API_ENDPOINT:-https://api.openai.com/v1}
      EMBEDDING_PROVIDER: ${MCPKIT_COGNEE_EMBEDDING_API_PROVIDER:-openai}
      EMBEDDING_API_KEY: ${MCPKIT_COGNEE_EMBEDDING_API_KEY:-}
      EMBEDDING_ENDPOINT: ${MCPKIT_COGNEE_EMBEDDING_API_ENDPOINT:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${MCPKIT_COGNEE_EMBEDDING_API_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${MCPKIT_COGNEE_EMBEDDING_DIMENSIONS:-1536}
      SYSTEM_ROOT_DIRECTORY: /cognee-storage/system
      DATA_ROOT_DIRECTORY: /cognee-storage/data
    volumes:
      - cognee_system:/cognee-storage/system
      - cognee_data:/cognee-storage/data
    labels: *kit-labels
    restart: unless-stopped
  memory:
    image: ${MCPKIT_NODE_IMAGE}
    build:
      context: ${MCPKIT_NODE_BUILD_DIR}
      labels: *kit-labels
    pull_policy: never
    environment:
      MEMORY_BANK_ROOT: /mcpkit/memory
    command: ["mcp-proxy", "--host", "0.0.0.0", "--port", "8000", "--server", "stream", "--", "mcp-server-memory-bank"]
    volumes:
      - memory_data:/mcpkit/memory
    labels: *kit-labels
    restart: unless-stopped
  gdrive:
    image: ${MCPKIT_NODE_IMAGE}
    pull_policy: never
    depends_on: [memory]
    environment:
      GDRIVE_CREDENTIALS_PATH: /mcpkit/gdrive/credentials.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -s /mcpkit/gdrive/credentials.json ]; do
          echo 'Waiting for Google Drive OAuth credentials.' >&2
          sleep 30
        done
        exec mcp-proxy --host 0.0.0.0 --port 8000 --server stream -- mcp-server-gdrive
    volumes:
      - gdrive_data:/mcpkit/gdrive
    labels: *kit-labels
    restart: unless-stopped
volumes:
  gateway_data: { labels: *kit-labels }
  neo4j_data: { labels: *kit-labels }
  qdrant_data: { labels: *kit-labels }
  embeddings_data: { labels: *kit-labels }
  cognee_system: { labels: *kit-labels }
  cognee_data: { labels: *kit-labels }
  memory_data: { labels: *kit-labels }
  gdrive_data: { labels: *kit-labels }
networks:
  default: { labels: *kit-labels }
  client:
    # No direct sidecar/database access for linked MetaMCP instances.
    internal: true
    labels: *kit-labels
