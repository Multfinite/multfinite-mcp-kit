# Optional presentation feature: expose native tool/prompt names.
# The one-server-per-endpoint restriction is enabled independently in the base Compose file.
# Internal MetaMCP routing/filtering continues to use the upstream identities.
services:
  app:
    build:
      labels:
        com.multfinite.mcpkit.clean-tools-patch: "1"
    environment:
      MCPKIT_CLEAN_TOOL_NAMES: "true"
